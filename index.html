<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color row</title>
    <style>
        .col1{
            background-color: red;
            height: 100px;
        }
        .col2{
            background-color: orangered;
            height: 100px;
        }
        .col3{
            background-color: yellow;
            height: 100px;
        }
        .col4{
            background-color: green;
            height: 100px;
        }
        .col5{
            background-color: blue;
            height: 100px;
        }
        .col6{
            background-color: indigo;
            height: 100px;
        }
        
    </style>
</head>
<table>
     <body>
        <div class="container">
            <div class="class col1">Red</div>
            <div class="class col2">Orange</div>
            <div class="class col3">Yellow</div>
            <div class="class col4">Green</div>
            <div class="class col5">Blue</div>
            <div class="class col6">Indigo</div>
        </div>
     </body>
</table>
</html>
